<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDLESS.SOFTWORKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Island Moments font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Island+Moments&display=swap" rel="stylesheet">
    
    <style>
        /* Apply the custom font */
        .font-island {
            font-family: 'Island Moments', cursive;
        }

        /* Phasing purple/gray gradient text */
        .phasing-text {
            background: linear-gradient(
                90deg, 
                #9ca3af 0%,     
                #d8b4fe 30%,    
                #a855f7 50%,    
                #d8b4fe 70%,    
                #9ca3af 100%    
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: phase 4s linear infinite;
        }

        @keyframes phase {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Gradient mask for the loading bar to make edges disappear */
        .fading-edges {
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }

        /* --- ANIMATION CLASSES --- */
        .hide-loader {
            opacity: 0 !important;
            transform: scale(0.5) !important;
        }

        .expand-text {
            transform: translateY(-35px) scale(0.8) !important;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 60px rgba(168, 85, 247, 0.4)) !important;
            letter-spacing: 0.1em;
        }

        @media (min-width: 768px) {
            .expand-text {
                transform: translateY(-45px) scale(0.9) !important;
            }
        }

        /* Custom Scrollbar for content */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 overflow-hidden select-none text-white font-sans">

    <!-- Loading Screen Overlay -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        
        <!-- The Loader Container (Bar + Percentage) -->
        <div id="loader-container" class="flex flex-col items-center justify-center mb-8 transition-all duration-700 ease-in-out w-full max-w-[280px]">
            <!-- Percentage Text -->
            <div id="loading-percent" class="text-purple-300 font-mono text-xs md:text-sm tracking-[0.2em] mb-4 drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]">
                0%
            </div>
            
            <!-- Loading Bar Track -->
            <div class="w-full h-[2px] bg-purple-900/40 fading-edges relative overflow-hidden">
                <!-- Loading Bar Fill -->
                <div id="loading-bar-fill" class="absolute top-0 left-0 h-full w-0 bg-purple-400 shadow-[0_0_15px_rgba(168,85,247,1)]"></div>
            </div>
        </div>

        <!-- The gradient text -->
        <h1 id="endless-text" class="font-island text-7xl md:text-9xl tracking-wide phasing-text font-normal drop-shadow-md transition-all duration-[1500ms] ease-in-out">
            endless.softworks
        </h1>
    </div>

    <!-- Main Website Content (Hidden initially) -->
    <div id="main-content" class="hidden opacity-0 transition-opacity duration-1000 min-h-screen w-full flex flex-col bg-black relative">
        
        <!-- Global Background Glow -->
        <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-purple-900/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

        <!-- Topbar -->
        <div class="fixed top-0 left-0 w-full h-20 flex items-center justify-between px-8 z-50 bg-black/50 backdrop-blur-md">
            <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50"></div>
            
            <!-- Left Logo -->
            <div class="font-island text-5xl tracking-wide phasing-text font-normal pb-2">
                endless.softworks
            </div>
        </div>

        <!-- Page Content Container (Allows scrolling) -->
        <div class="flex-1 w-full h-full pt-28 pb-12 px-6 overflow-y-auto z-10 relative">
            
            <!-- HOME TAB -->
            <div class="flex flex-col items-center justify-center min-h-[70vh] w-full transition-opacity duration-500">
                <h2 class="font-island text-6xl md:text-8xl mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-gray-400 text-center font-normal tracking-wide">
                    welcome to endless.softworks
                </h2>
                <p class="text-purple-300/80 font-mono text-sm tracking-widest uppercase text-center mb-10">
                    Best Gamesense Anti-aim Lua
                </p>

                <!-- Get Endless.lua Button -->
                <button id="get-endless-btn" class="relative px-10 py-2 text-4xl md:text-5xl font-island tracking-wide text-gray-300 hover:text-purple-300 transition-colors duration-300 group cursor-pointer focus:outline-none pb-4">
                    get endless.lua
                    <!-- Dissolving bottom gradient bar -->
                    <div class="absolute bottom-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-60 group-hover:opacity-100 group-hover:shadow-[0_0_15px_rgba(168,85,247,0.8)] transition-all duration-300"></div>
                </button>
            </div>

        </div>
    </div>

    <!-- Invite Menu Overlay -->
    <div id="invite-overlay" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-black transition-opacity duration-1000 opacity-0">
        <div id="invite-menu" class="bg-[#050505] border border-purple-500/40 shadow-[0_0_40px_rgba(168,85,247,0.3)] rounded-2xl p-10 max-w-lg w-full mx-4 text-center transform scale-90 transition-all duration-1000 opacity-0 relative overflow-hidden">
            <!-- Subtle background glow inside the menu -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-1/2 bg-purple-900/20 blur-[50px] pointer-events-none"></div>

            <h3 class="font-island text-6xl md:text-7xl phasing-text mb-6 relative z-10">Endless.lua</h3>
            
            <p class="text-gray-400 font-mono text-sm md:text-base leading-relaxed mb-6 relative z-10">
                Contact <span class="text-purple-400 font-bold drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]">zotiax</span> on Discord for an invite.<br><br>
                Send a message with this code:
            </p>
            
            <!-- Code Container -->
            <div class="bg-black border border-purple-900/60 rounded-lg p-4 relative z-10 group hover:border-purple-500/60 transition-colors cursor-text">
                <p id="invite-code" class="text-purple-400 font-mono text-xl md:text-2xl tracking-[0.15em] break-all select-all drop-shadow-[0_0_8px_rgba(168,85,247,0.6)] font-bold"></p>
            </div>
            
            <p class="text-gray-600 text-xs font-mono mt-6 relative z-10">Code is strictly valid for one request.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loaderContainer = document.getElementById("loader-container");
            const percentText = document.getElementById("loading-percent");
            const barFill = document.getElementById("loading-bar-fill");
            const text = document.getElementById("endless-text");
            const loadingScreen = document.getElementById("loading-screen");
            const mainContent = document.getElementById("main-content");

            const getBtn = document.getElementById("get-endless-btn");
            const inviteOverlay = document.getElementById("invite-overlay");
            const inviteMenu = document.getElementById("invite-menu");
            const inviteCodeDisplay = document.getElementById("invite-code");

            // --- Random Code Generator ---
            function generateInviteCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
                let result = '';
                for (let i = 0; i < 15; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // --- Button Click Event ---
            getBtn.addEventListener("click", () => {
                // Fade to black
                inviteOverlay.classList.remove("hidden");
                inviteOverlay.classList.add("flex");
                
                setTimeout(() => {
                    inviteOverlay.classList.remove("opacity-0");
                    
                    // Wait for the screen to go black, then wait "a while" (1.5s total delay)
                    setTimeout(() => {
                        // Generate the unique code
                        inviteCodeDisplay.innerText = generateInviteCode();
                        
                        // Pop up the menu
                        inviteMenu.classList.remove("scale-90", "opacity-0");
                        inviteMenu.classList.add("scale-100", "opacity-100");
                        
                    }, 1500);
                }, 50);
            });

            // Allow normal scrolling once loaded
            document.body.classList.remove("overflow-hidden");

            // --- JS Animation for the percentage and bar width ---
            let startTime = null;
            const loadDuration = 2800; 

            function animateLoader(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / loadDuration, 1);
                
                const easeProgress = 1 - Math.pow(1 - progress, 4);
                const percent = Math.floor(easeProgress * 100);
                
                percentText.innerText = `${percent}%`;
                barFill.style.width = `${easeProgress * 100}%`;
                
                if (progress < 1) {
                    requestAnimationFrame(animateLoader);
                }
            }
            
            requestAnimationFrame(animateLoader);

            setTimeout(() => {
                loaderContainer.classList.add("hide-loader");
                text.classList.add("expand-text");

                setTimeout(() => {
                    loadingScreen.classList.add("opacity-0");

                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        mainContent.classList.remove("hidden");
                        
                        setTimeout(() => {
                            mainContent.classList.remove("opacity-0");
                        }, 50);

                    }, 1000); 
                }, 1800); 
            }, 3000); 
        });
    </script>
</body>
</html>
